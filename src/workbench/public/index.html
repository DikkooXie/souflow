<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.mjs"></script>
    <title>souflow</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-start">
        <button type="button" id="toggle-conversations" class="sidebar-toggle" aria-label="展开最近对话" title="展开最近对话" aria-expanded="false" aria-controls="conversation-sidebar" data-track="toggle-conversations">
          <span class="sidebar-icon" aria-hidden="true"></span>
        </button>
        <button type="button" class="brand" aria-label="souflow 首页" id="home" data-track="open-home">
          <span class="brand-mark" aria-hidden="true">✦</span><span>souflow</span>
        </button>
      </div>
      <div class="topbar-actions">
        <button type="button" id="open-decisions" class="inbox-button" data-track="open-decisions" aria-haspopup="dialog" aria-controls="decision-dialog">待决策 <span id="count" aria-live="polite">0</span></button>
        <button type="button" id="open-audit" class="audit-nav" data-track="open-audit" aria-pressed="false">数据看板</button>
      </div>
    </header>

    <div class="workbench-layout">
      <aside id="conversation-sidebar" class="conversation-sidebar" aria-labelledby="recent-title" hidden>
        <button type="button" id="new-conversation" class="new-conversation" data-track="new-conversation"><span aria-hidden="true">+</span> 新对话</button>
        <h2 id="recent-title">最近对话</h2>
        <p id="recent-empty" class="muted">暂无对话</p>
        <ul id="recent-conversations" class="recent-conversations"></ul>
      </aside>
      <button type="button" id="sidebar-scrim" class="sidebar-scrim" aria-label="收起最近对话" tabindex="-1" hidden></button>

    <main class="workspace" id="workspace">
      <section id="welcome" class="welcome" aria-labelledby="welcome-title">
        <span class="brand-mark hero-mark" aria-hidden="true">✦</span>
        <h1 id="welcome-title">今天想推进什么？</h1>
      </section>
      <section id="conversation" class="conversation" aria-labelledby="conversation-title" hidden>
        <h1 id="conversation-title" class="visually-hidden" tabindex="-1">需求对话</h1>
        <p id="conversation-message" class="user-message"></p>
        <div class="conversation-reply">
          <p id="conversation-status" class="flow-status" role="status"></p>
          <details id="project-context" class="history project-context" hidden>
            <summary>本轮参考资料</summary>
            <ul id="project-sources"></ul>
          </details>
          <button type="button" id="open-archive" class="archive-entry" data-track="open-archive" aria-haspopup="dialog" aria-controls="archive-dialog" hidden>
            <span class="document-icon" aria-hidden="true"></span>查看项目文档<span aria-hidden="true">↗</span>
          </button>
          <button type="button" id="open-dispatch" class="archive-entry" data-track="open-local-dispatch" aria-haspopup="dialog" aria-controls="dispatch-dialog" hidden>本地执行工单</button>
        </div>
      </section>

      <form id="start-session" class="composer">
        <textarea id="new-prompt" name="new-prompt" aria-label="描述你的需求" placeholder="描述你的需求…" required></textarea>
        <div class="composer-actions">
          <span id="mode" class="mode-label">本地演示</span>
          <button type="submit" class="send-button" aria-label="发送需求" data-track="send-request"><span aria-hidden="true">→</span></button>
        </div>
      </form>
      <p id="error" class="error" role="alert" hidden></p>
    </main>

    <main id="audit" class="audit" hidden>
      <header class="audit-header">
        <div>
          <h1 id="audit-title" tabindex="-1">工作台数据看板</h1>
          <p>查看日常操作、流程记录和值得简化的路径。</p>
        </div>
        <div class="audit-controls">
          <select id="audit-range" aria-label="统计时间范围">
            <option value="1">过去 24 小时</option>
            <option value="7" selected>过去 7 天</option>
            <option value="30">过去 30 天</option>
          </select>
          <button type="button" class="audit-nav" id="refresh-audit" data-track="refresh-audit">刷新</button>
        </div>
      </header>
      <p id="audit-status" class="audit-status" role="status">正在读取记录…</p>
      <dl id="audit-totals" class="audit-totals"></dl>
      <section class="audit-insights" aria-labelledby="audit-insights-title">
        <h2 id="audit-insights-title">优化线索</h2>
        <ul id="audit-insights"></ul>
      </section>
      <div class="audit-breakdown">
        <section aria-labelledby="audit-clicks-title">
          <h2 id="audit-clicks-title">点击与重复</h2>
          <p id="audit-click-rule" class="audit-help"></p>
          <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: 排行没有可聚焦的子元素，键盘用户可聚焦区块后滚动。 -->
          <section class="audit-ranking-scroll" aria-label="点击与重复排行" tabindex="0">
            <ul id="audit-clicks" class="audit-ranking"></ul>
          </section>
        </section>
        <section aria-labelledby="audit-paths-title">
          <h2 id="audit-paths-title">视图切换</h2>
          <p id="audit-return-rule" class="audit-help"></p>
          <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: 排行没有可聚焦的子元素，键盘用户可聚焦区块后滚动。 -->
          <section class="audit-ranking-scroll" aria-label="视图切换排行" tabindex="0">
            <ul id="audit-paths" class="audit-ranking"></ul>
          </section>
        </section>
      </div>
      <details class="audit-log">
        <summary data-track="toggle-audit-log"><span id="audit-log-title">最近记录</span><span id="audit-log-count"></span></summary>
        <div class="audit-log-header">
          <p class="audit-help">每类最多显示 60 条。</p>
          <select id="audit-log-type" aria-label="记录类型">
            <option value="flow">流程事件</option>
            <option value="interaction">操作事件</option>
          </select>
        </div>
        <section class="audit-log-scroll" aria-labelledby="audit-log-title">
          <ol id="audit-events"></ol>
        </section>
      </details>
    </main>
    </div>

    <dialog id="archive-dialog" class="archive-dialog" aria-labelledby="archive-title">
      <header class="archive-header">
        <div>
          <h2 id="archive-title">项目文档</h2>
          <p id="archive-project"></p>
        </div>
        <button type="button" id="close-archive" class="icon-button" aria-label="关闭项目文档" data-track="close-archive" autofocus>×</button>
      </header>
      <div class="archive-layout">
        <nav aria-label="已归档文档"><ul id="archive-list" class="archive-list"></ul></nav>
        <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: 让键盘用户能在文档长页内滚动。 -->
        <article id="archive-document" class="archive-document" tabindex="0" aria-labelledby="archive-document-title"></article>
      </div>
    </dialog>
    <dialog id="dispatch-dialog" class="archive-dialog" aria-labelledby="dispatch-title">
      <header class="archive-header">
        <h2 id="dispatch-title">本地执行工单</h2>
        <button type="button" class="icon-button" id="close-dispatch" aria-label="关闭工单" autofocus>×</button>
      </header>
      <section class="dispatch-body" aria-label="工单及产物">
        <p id="dispatch-status" role="status"></p>
        <p class="error" role="alert" hidden></p>
        <p><label for="dispatch-kind">工单类型</label>
          <select id="dispatch-kind"><option value="report">只读核验</option><option value="code">编写代码</option></select>
        </p>
        <button type="button" id="prepare-dispatch" class="button button-primary" data-track="prepare-local-dispatch">准备工单</button>
        <button type="button" id="start-dispatch" class="button button-primary" data-track="start-local-dispatch" hidden>确认并执行</button>
        <ul id="dispatch-jobs" class="dispatch-jobs"></ul>
      </section>
    </dialog>
    <dialog id="decision-dialog" aria-labelledby="decision-title">
      <header class="decision-header">
        <h2 id="decision-title">决策收件箱</h2>
        <button id="close-decision" type="button" class="icon-button" data-track="close-decisions" aria-label="关闭决策" autofocus>×</button>
      </header>
      <div class="decision-body">
        <p id="decision-feedback" role="status"></p>
        <section id="decision-queue" aria-label="待决策事项" hidden>
          <ul id="requests" class="request-list"></ul>
        </section>
        <section id="detail" aria-label="当前决策"></section>
        <p id="decision-error" class="error" role="alert" hidden></p>
        <footer class="decision-footer">
          <button type="button" id="reset" class="quiet-button" data-track="reset-demo">重置演示</button>
        </footer>
      </div>
    </dialog>

    <template id="detail-template">
      <div class="detail-meta"><span class="ticket-key"></span><span class="status">待回答</span></div>
      <h3 class="ticket-title" tabindex="-1">当前提问</h3>
      <p class="source-message"></p>
      <form class="question-form">
        <div class="questions"></div>
        <div class="actions"></div>
      </form>
      <details class="history"><summary data-track="open-history">时间线</summary><ol class="timeline"></ol></details>
    </template>
  </body>
</html>
